name: Production Deployment

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://coursdelasouris.fr
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'pnpm'
      
      - name: Install pnpm
        run: npm install -g pnpm
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Run migrations (D1)
        run: pnpm db:migrate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_ID: ${{ secrets.CLOUDFLARE_D1_ID }}
      
      - name: Backup D1 database
        run: |
          echo "Backup D1: À implémenter avec wrangler"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_ID: ${{ secrets.CLOUDFLARE_D1_ID }}
      
      - name: Build frontend
        run: pnpm --filter @cours-de-la-souris/web build
      
      - name: Build worker
        run: pnpm --filter @cours-de-la-souris/worker build
      
      - name: Deploy to Cloudflare (Production)
        uses: cloudflare/wrangler-action@3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env production
          workingDirectory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_ID: ${{ secrets.CLOUDFLARE_D1_ID }}
          CLOUDFLARE_KV_ID: ${{ secrets.CLOUDFLARE_KV_ID }}
          CLOUDFLARE_R2_ID: ${{ secrets.CLOUDFLARE_R2_ID }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
      
      - name: Smoke tests
        run: |
          curl -sSf https://api.coursdelasouris.fr/api/v1/health || exit 1
          curl -sSf https://coursdelasouris.fr || exit 1
      
      - name: Notify Slack
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **Production Deployment**\n\n📦 Version: ${context.ref}\n🔗 URL: https://coursdelasouris.fr\n✅ Smoke tests: Passed`
            });